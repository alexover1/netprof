# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: "10.0.x"

    - name: Validate release tag
      id: version
      shell: bash
      run: |
        if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid release tag: $GITHUB_REF_NAME"
          echo "Expected format: vMAJOR.MINOR.PATCH, e.g. v0.1.0"
          exit 1
        fi

        VERSION="${GITHUB_REF_NAME#v}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Publishing Netprof $VERSION"

    - name: Restore
      run: dotnet restore src/library/Netprof.csproj

    - name: Pack
      run: >
        dotnet pack src/library/Netprof.csproj
        -c Release
        --no-restore
        -o ./artifacts
        -p:PackageVersion=${{ steps.version.outputs.version }}

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: alexover1

    - name: NuGet push
      run: >
        dotnet nuget push "artifacts/*.nupkg"
        --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
        --source "https://api.nuget.org/v3/index.json"
        --skip-duplicate
